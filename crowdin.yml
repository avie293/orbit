# Crowdin configuration for Orbit
#
# Source language: English (ui/locales/en.json)
# Crowdin writes translations to ui/locales/<two-letter code>.json (de, fr, pt, zh, ...) – Orbit picks
# the system language automatically and falls back to English.
#
# Credentials are read from environment variables, never commit them:
#   CROWDIN_PROJECT_ID      – shown in the Crowdin project under Tools > API
#   CROWDIN_PERSONAL_TOKEN  – Account Settings > API > New token

project_id_env: CROWDIN_PROJECT_ID
api_token_env: CROWDIN_PERSONAL_TOKEN
preserve_hierarchy: true

files:
  - source: /ui/locales/en.json
    translation: /ui/locales/%two_letters_code%.json

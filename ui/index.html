<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Orbit</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- SVG icon sprite (line icons) -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.7 3.8 5.7 3.8 9s-1.3 6.3-3.8 9c-2.5-2.7-3.8-5.7-3.8-9S9.5 5.7 12 3z"/></symbol>
    <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7.5A2.5 2.5 0 0 1 5.5 5H9l2 2.5h7.5A2.5 2.5 0 0 1 21 10v6.5a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 16.5z"/></symbol>
    <symbol id="i-music" viewBox="0 0 24 24"><path d="M9 18V6l11-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="17.5" cy="16" r="2.5"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><rect x="2.5" y="5" width="19" height="14" rx="4"/><path d="M10 9.2v5.6l4.8-2.8z" fill="currentColor"/></symbol>
    <symbol id="i-left" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
    <symbol id="i-right" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></symbol>
    <symbol id="i-reload" viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M4 11l8-6.5 8 6.5V19a1 1 0 0 1-1 1h-4.5v-5h-5v5H5a1 1 0 0 1-1-1z"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></symbol>
    <symbol id="i-min" viewBox="0 0 24 24"><path d="M6 12h12"/></symbol>
    <symbol id="i-max" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></symbol>
    <symbol id="i-popout" viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-8 8"/><path d="M18 14v4a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4"/></symbol>
    <symbol id="i-dock" viewBox="0 0 24 24"><path d="M10 14H4M10 14v6M10 14l-6.5 6.5"/><path d="M14 4h4a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-4M4 10V6a2 2 0 0 1 2-2h4"/></symbol>
    <symbol id="i-puzzle" viewBox="0 0 24 24"><path d="M10 4.5a2 2 0 1 1 4 0V6h3.5a1 1 0 0 1 1 1v3.5H20a2 2 0 1 1 0 4h-1.5V18a1 1 0 0 1-1 1H14v-1.5a2 2 0 1 0-4 0V19H6.5a1 1 0 0 1-1-1v-3.5H7a2 2 0 1 0 0-4H5.5V7a1 1 0 0 1 1-1H10z"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4.5 7h15M10 11v6M14 11v6M6.5 7l1 12a1.5 1.5 0 0 0 1.5 1.4h6a1.5 1.5 0 0 0 1.5-1.4l1-12M9 7V4.5h6V7"/></symbol>
    <symbol id="i-open" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
    <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></symbol>
    <symbol id="i-prev" viewBox="0 0 24 24"><path d="M7 6v12M18 6l-8 6 8 6z"/></symbol>
    <symbol id="i-next" viewBox="0 0 24 24"><path d="M17 6v12M6 6l8 6-8 6z"/></symbol>
    <symbol id="i-pp" viewBox="0 0 24 24"><path d="M8 5.5v13l10.5-6.5z"/></symbol>
  </svg>

  <div id="app">
    <!-- Title bar with tabs -->
    <header id="titlebar" data-tauri-drag-region>
      <div class="brand" data-tauri-drag-region>
        <span class="logo"></span>
      </div>
      <div id="tabstrip">
        <div id="tabs"></div>
        <button id="new-tab" class="icon-btn sm" data-i18n-title="tabs.new"><svg><use href="#i-plus"/></svg></button>
      </div>
      <div id="view-title" data-tauri-drag-region hidden></div>
      <div class="drag-fill" data-tauri-drag-region></div>
      <div class="win-controls">
        <button id="win-min" data-i18n-title="window.minimize"><svg><use href="#i-min"/></svg></button>
        <button id="win-max" data-i18n-title="window.maximize"><svg><use href="#i-max"/></svg></button>
        <button id="win-close" class="close" data-i18n-title="window.close"><svg><use href="#i-x"/></svg></button>
      </div>
    </header>

    <!-- Left rail -->
    <nav id="rail">
      <button class="rail-btn active" data-view="browser" data-i18n-title="nav.browser"><svg><use href="#i-globe"/></svg></button>
      <button class="rail-btn yt" data-view="youtube" data-i18n-title="nav.youtube"><svg><use href="#i-play"/></svg></button>
      <button class="rail-btn" data-view="explorer" data-i18n-title="nav.files"><svg><use href="#i-folder"/></svg></button>
      <button class="rail-btn" data-view="music" data-i18n-title="nav.music"><svg><use href="#i-music"/></svg></button>
      <div class="rail-spacer"></div>
      <button class="rail-btn" data-view="extensions" data-i18n-title="nav.extensions"><svg><use href="#i-puzzle"/></svg></button>
      <button class="rail-btn" data-view="settings" data-i18n-title="nav.settings"><svg><use href="#i-gear"/></svg></button>
    </nav>

    <!-- Main area -->
    <main id="main">
      <section id="view-browser" class="view card">
        <div id="toolbar">
          <button class="icon-btn" id="nav-back" data-i18n-title="toolbar.back"><svg><use href="#i-left"/></svg></button>
          <button class="icon-btn" id="nav-fwd" data-i18n-title="toolbar.forward"><svg><use href="#i-right"/></svg></button>
          <button class="icon-btn" id="nav-reload" data-i18n-title="toolbar.reload"><svg><use href="#i-reload"/></svg></button>
          <form id="address-form" autocomplete="off">
            <svg class="addr-icon"><use href="#i-search"/></svg>
            <input id="address" spellcheck="false" data-i18n-placeholder="toolbar.addressPlaceholder" />
          </form>
          <div id="progress"></div>
        </div>
        <div id="viewport">
          <!-- Start page for new tabs; real web pages are native webviews placed on top -->
          <div id="start">
            <div class="start-inner">
              <div class="start-logo"><span class="logo big"></span></div>
              <h1 id="greeting"></h1>
              <p id="clock" class="muted"></p>
              <form id="start-form" autocomplete="off">
                <svg><use href="#i-search"/></svg>
                <input id="start-input" spellcheck="false" data-i18n-placeholder="start.searchPlaceholder" />
              </form>
              <div id="quick"></div>
            </div>
          </div>
        </div>
      </section>

      <section id="view-youtube" class="view card" hidden>
        <div class="panel-head">
          <span class="yt-badge"><svg><use href="#i-play"/></svg></span>
          <span class="panel-title">YouTube</span>
          <div class="sep"></div>
          <button class="icon-btn" data-yt="back" data-i18n-title="youtube.back"><svg><use href="#i-left"/></svg></button>
          <button class="icon-btn" data-yt="reload" data-i18n-title="youtube.reload"><svg><use href="#i-reload"/></svg></button>
          <button class="icon-btn" data-yt="home" data-i18n-title="youtube.home"><svg><use href="#i-home"/></svg></button>
          <div class="grow"></div>
          <button class="pill-btn" id="yt-popout" data-i18n-title="youtube.popoutHint">
            <svg><use href="#i-popout"/></svg><span data-i18n="youtube.popout"></span>
          </button>
        </div>
        <div id="yt-viewport">
          <div id="yt-popped" hidden>
            <div class="ph">
              <div class="ph-icon red"><svg><use href="#i-popout"/></svg></div>
              <h2 data-i18n="youtube.poppedTitle"></h2>
              <p class="muted" data-i18n="youtube.poppedText"></p>
              <button class="pill-btn primary" id="yt-dock"><svg><use href="#i-dock"/></svg><span data-i18n="youtube.dock"></span></button>
            </div>
          </div>
        </div>
      </section>

      <section id="view-extensions" class="view card" hidden>
        <div class="ext-wrap">
          <div class="ext-head">
            <div class="ph-icon"><svg><use href="#i-puzzle"/></svg></div>
            <div>
              <h2 data-i18n="ext.title"></h2>
              <p class="muted" data-i18n="ext.subtitle"></p>
            </div>
          </div>
          <form id="ext-form" autocomplete="off">
            <svg><use href="#i-search"/></svg>
            <input id="ext-input" spellcheck="false" data-i18n-placeholder="ext.inputPlaceholder" />
            <button class="pill-btn primary" id="ext-install" type="submit"><svg><use href="#i-plus"/></svg><span data-i18n="ext.install"></span></button>
          </form>
          <div class="ext-actions">
            <button class="pill-btn" id="ext-store"><svg><use href="#i-globe"/></svg><span data-i18n="ext.openStore"></span></button>
            <span class="muted small" id="ext-msg"></span>
          </div>
          <div id="ext-list"></div>
          <p class="muted small ext-note" data-i18n="ext.note"></p>
        </div>
      </section>

      <section id="view-settings" class="view card" hidden>
        <div class="ext-wrap">
          <div class="ext-head">
            <div class="ph-icon"><svg><use href="#i-gear"/></svg></div>
            <h2 data-i18n="view.settings"></h2>
          </div>
          <div class="setting-row">
            <div>
              <div class="setting-label" data-i18n="settings.language"></div>
              <div class="muted small" data-i18n="settings.languageHint"></div>
            </div>
            <select id="lang-select"></select>
          </div>
        </div>
      </section>

      <section id="view-explorer" class="view card placeholder" hidden>
        <div class="ph">
          <div class="ph-icon"><svg><use href="#i-folder"/></svg></div>
          <h2 data-i18n="files.title"></h2>
          <p class="muted" data-i18n="files.soon"></p>
          <ul>
            <li data-i18n="files.feature1"></li>
            <li data-i18n="files.feature2"></li>
            <li data-i18n="files.feature3"></li>
            <li data-i18n="files.feature4"></li>
          </ul>
        </div>
      </section>

      <section id="view-music" class="view card placeholder" hidden>
        <div class="ph">
          <div class="ph-icon green"><svg><use href="#i-music"/></svg></div>
          <h2 data-i18n="music.title"></h2>
          <p class="muted" data-i18n="music.soon"></p>
          <ul>
            <li data-i18n="music.feature1"></li>
            <li data-i18n="music.feature2"></li>
            <li data-i18n="music.feature3"></li>
          </ul>
        </div>
      </section>
    </main>

    <!-- Mini player -->
    <footer id="player">
      <div class="track">
        <div class="cover"></div>
        <div>
          <div class="track-title" data-i18n="player.idleTitle"></div>
          <div class="track-artist muted" data-i18n="player.idleSubtitle"></div>
        </div>
      </div>
      <div class="controls">
        <button class="icon-btn" disabled><svg><use href="#i-prev"/></svg></button>
        <button class="play-btn" disabled><svg><use href="#i-pp"/></svg></button>
        <button class="icon-btn" disabled><svg><use href="#i-next"/></svg></button>
        <div class="seek"><div class="seek-fill"></div></div>
      </div>
      <div class="player-right muted" id="status-text"></div>
    </footer>
  </div>

  <script src="bridge.js"></script>
  <script src="i18n.js"></script>
  <script src="app.js"></script>
</body>
</html>
